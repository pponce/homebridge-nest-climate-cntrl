name: Schedule validation details
on:
  push:
    branches: [feature/native-schedules-room-learning]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - id: lint
        name: Collect lint details
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import fs from 'node:fs';
          const result=spawnSync('npx',['eslint','src/nest-schedules.js','src/system.js','src/google-feedback.js','src/climate-dashboard.js','src/climate-automation.js','src/plugins/thermostat.js','src/web-dashboard.js','test/nest-schedules.test.js','test/system-set.test.js','test/climate-automation.test.js','test/web-dashboard.test.js','scripts/build-dashboard-ui.js','--format','json'],{encoding:'utf8'});
          const rows=JSON.parse(result.stdout);
          rows.forEach((row,i)=>fs.appendFileSync(process.env.GITHUB_OUTPUT,'file'+i+'='+row.filePath.split('/').slice(-2).join('/')+': '+row.messages.map(m=>m.line+':'+m.column+' '+m.ruleId+' '+m.message).join(' | ')+'\n'));
          JS
      - name: "${{ steps.lint.outputs.file0 }}"
        run: echo 'Lint diagnostics collected.'
      - name: "${{ steps.lint.outputs.file1 }}"
        run: echo 'Lint diagnostics collected.'
      - name: "${{ steps.lint.outputs.file2 }}"
        run: echo 'Lint diagnostics collected.'
      - name: "${{ steps.lint.outputs.file3 }}"
        run: echo 'Lint diagnostics collected.'
      - name: "${{ steps.lint.outputs.file4 }}"
        run: echo 'Lint diagnostics collected.'
      - name: "${{ steps.lint.outputs.file5 }}"
        run: echo 'Lint diagnostics collected.'
      - name: "${{ steps.lint.outputs.file6 }}"
        run: echo 'Lint diagnostics collected.'
      - name: "${{ steps.lint.outputs.file7 }}"
        run: echo 'Lint diagnostics collected.'
      - name: "${{ steps.lint.outputs.file8 }}"
        run: echo 'Lint diagnostics collected.'
      - name: "${{ steps.lint.outputs.file9 }}"
        run: echo 'Lint diagnostics collected.'
      - name: "${{ steps.lint.outputs.file10 }}"
        run: echo 'Lint diagnostics collected.'
      - name: "${{ steps.lint.outputs.file11 }}"
        run: echo 'Lint diagnostics collected.'
      - run: npm test
